name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run commit hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "0.4.x"

      - name: Run push-stage hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "0.4.x"
          extra-args: --all-files --hook-stage pre-push

      - name: Run tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release

      # The CLI declares no `version` in its clap command, so `--help` is the
      # smoke check. Reuse the release artifacts rather than letting cargo
      # install compile again in its own target dir.
      - name: Install smoke test
        run: |
          cargo install --path . --root "$RUNNER_TEMP/yoclaw" --locked --target-dir target
          "$RUNNER_TEMP/yoclaw/bin/yoclaw" --help
