minimum_prek_version: "0.4.14"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        # Rust inner attributes (`#![allow(...)]`) look like shebangs to this hook.
        exclude: '\.rs$'
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: require-pattern
        name: commit message prefix
        stages: [commit-msg]
        args: ['^(Merge |(feat|fix|docs|test|build|ci|refactor|perf|chore)(\([a-z0-9-]+\))?: [a-z])']

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        types_or: [rust]

      # Compiles the crate, so it runs once per push rather than once per commit.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust]
        stages: [pre-push]
